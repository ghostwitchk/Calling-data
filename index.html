<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#2f6bff">
<title>Calling Performance Dashboard</title>
<style>
:root{--tx:#0f1b3d;--mut:#5d6b8a;--card:rgba(255,255,255,.92);--line:#e2e9f6;--hd:#dce7fd;--acc:#2f6bff;--g:#2e9e2e;--p:#4a4aa8;--b:#2f8cff;--r:#ee5555;--o:#f59e0b;--pu:#7c4dff;--sh:0 6px 24px rgba(40,70,140,.10);
--page:linear-gradient(160deg,#e6efff 0%,#f6f9ff 45%,#eef2ff 100%)}
@media (prefers-color-scheme:dark){:root{--tx:#eaf0ff;--mut:#9aa8c7;--card:rgba(24,32,56,.92);--line:#2a3452;--hd:#22305a;--sh:0 6px 24px rgba(0,0,0,.35);--page:linear-gradient(160deg,#0b1122 0%,#111a33 100%)}}
*{box-sizing:border-box}
html{background:var(--page);min-height:100%}
body{margin:0 auto;color:var(--tx);font:15px/1.4 -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;padding:16px;max-width:1120px;-webkit-font-smoothing:antialiased}
#cap{padding:4px}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.logo{width:48px;height:48px;border-radius:14px;background:linear-gradient(135deg,#4aa3ff,#2f6bff);display:grid;place-items:center;color:#fff;box-shadow:0 8px 18px rgba(47,107,255,.35);flex:none}
.logo svg{width:26px;height:26px}
.ttl{flex:1;min-width:200px}
h1{font-size:clamp(20px,4.6vw,30px);margin:0;letter-spacing:-.4px;font-weight:800}
.sub{color:var(--mut);font-size:13px;margin-top:2px}
h2{font-size:18px;margin:0 0 12px;font-weight:800;letter-spacing:-.2px}
.btn{font:inherit;font-weight:700;color:#fff;background:linear-gradient(135deg,#4aa3ff,#2f6bff);border:0;border-radius:12px;padding:10px 16px;cursor:pointer;box-shadow:0 6px 14px rgba(47,107,255,.3)}
.btn:active{transform:scale(.97)}
.tabs{display:flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px;margin-bottom:14px;box-shadow:var(--sh)}
.tabs button{flex:1;padding:11px;border:0;background:transparent;color:var(--mut);border-radius:11px;font:inherit;font-weight:700;cursor:pointer}
.tabs button.on{background:linear-gradient(135deg,#4aa3ff,#2f6bff);color:#fff;box-shadow:0 4px 12px rgba(47,107,255,.3)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--sh);backdrop-filter:blur(6px)}
.kpi{display:flex;gap:12px;align-items:center;padding:14px}
.ic{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;flex:none}
.ic svg{width:21px;height:21px}
.kpi .l{color:var(--mut);font-size:12px;font-weight:700}
.kpi .v{font-size:clamp(24px,5vw,32px);font-weight:800;line-height:1.1;letter-spacing:-.5px}
.k-a .ic{background:rgba(47,140,255,.15);color:var(--b)}.k-a{background:linear-gradient(135deg,rgba(47,140,255,.10),transparent),var(--card)}
.k-c .ic{background:rgba(46,158,46,.15);color:var(--g)}.k-c{background:linear-gradient(135deg,rgba(46,158,46,.12),transparent),var(--card)}
.k-v .ic{background:rgba(124,77,255,.15);color:var(--pu)}.k-v{background:linear-gradient(135deg,rgba(124,77,255,.12),transparent),var(--card)}
.k-r .ic{background:rgba(47,140,255,.15);color:var(--b)}.k-r{background:linear-gradient(135deg,rgba(47,140,255,.08),transparent),var(--card)}
.k-t .ic{background:rgba(245,158,11,.18);color:var(--o)}.k-t{background:linear-gradient(135deg,rgba(245,158,11,.12),transparent),var(--card)}
.grid{display:grid;grid-template-columns:1fr;gap:14px;margin-bottom:14px}
@media(min-width:860px){.grid{grid-template-columns:1.65fr 1fr}}
.sc{overflow-x:auto}
table{border-collapse:separate;border-spacing:0 4px;width:100%;font-size:14px;min-width:480px}
th{background:var(--hd);padding:9px 8px;font-size:12px;text-align:center;white-space:nowrap}
th:first-child{border-radius:10px 0 0 10px;text-align:left}th:last-child{border-radius:0 10px 10px 0}
th:nth-child(2){text-align:left}
td{padding:9px 8px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap}
td:nth-child(2){text-align:left}
td.grp{font-weight:800;text-align:left;border-radius:12px;border:0;padding:10px 12px;min-width:96px;white-space:normal;line-height:1.15}
.grp.g{background:rgba(46,158,46,.14);color:var(--g)}.grp.b{background:rgba(47,140,255,.14);color:var(--b)}
.grp.r{background:rgba(238,85,85,.14);color:var(--r)}.grp.p{background:rgba(74,74,168,.16);color:#7b7be0}
tr.st td{font-weight:800;background:rgba(46,158,46,.12);color:var(--g);border:0}
tr.st td:first-child{border-radius:10px 0 0 10px}tr.st td:last-child{border-radius:0 10px 10px 0}
tr.tot td{font-weight:800;font-size:16px;background:var(--hd);border:0;padding:12px 8px}
tr.tot td:first-child{border-radius:12px 0 0 12px;text-align:left}tr.tot td:last-child{border-radius:0 12px 12px 0}
.mu{color:var(--mut)}
.donut{display:block;margin:0 auto 10px;max-width:250px;width:100%}
.leg{display:flex;justify-content:space-between;gap:8px;font-size:14px;padding:5px 0;border-top:1px solid var(--line)}
.dot{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:8px;vertical-align:-1px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;margin-bottom:6px;-webkit-overflow-scrolling:touch}
.chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--tx);border-radius:999px;padding:8px 14px;font:inherit;font-weight:700;font-size:13px;cursor:pointer;box-shadow:var(--sh)}
.chip.on{background:linear-gradient(135deg,#4aa3ff,#2f6bff);color:#fff;border-color:transparent}
.dayhead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:2px 2px 12px}
.dayhead b{font-size:20px;letter-spacing:-.3px}
.msg{padding:11px 14px;border-radius:12px;background:rgba(245,158,11,.15);border:1px solid rgba(245,158,11,.4);margin-bottom:12px;font-size:13px}
.empty{padding:26px;text-align:center;color:var(--mut)}
.hide{display:none}
.leg2{display:flex;gap:14px;font-size:12px;color:var(--mut);margin-top:6px}
</style></head><body>
<div id="cap">
<div class="top">
  <div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/></svg></div>
  <div class="ttl"><h1 id="title">Calling Performance Dashboard</h1><div class="sub" id="range">Loading…</div></div>
  <button class="btn" id="shot" data-noshot="1">📷 Screenshot</button>
</div>
<div id="msg" class="msg hide" data-noshot="1"></div>
<div class="tabs" data-noshot="1"><button data-t="cum" class="on">Cumulative</button><button data-t="day">Daily</button></div>

<section id="cum">
  <div class="kpis" id="cumKpis"></div>
  <div class="grid">
    <div class="card sc"><h2>Detailed Calling Report <span class="mu" style="font-weight:600;font-size:13px">(Cumulative)</span></h2><div id="cumTable"></div></div>
    <div class="card"><h2>Calls Attempted by Report</h2><svg class="donut" id="cumDonut" viewBox="0 0 200 200"></svg><div id="cumLeg"></div></div>
  </div>
</section>

<section id="day" class="hide">
  <div class="chips" id="chips" data-noshot="1"></div>
  <div id="dayBody">
    <div class="dayhead"><b id="dayLbl"></b><span class="mu" id="daySub"></span></div>
    <div class="kpis" id="dayKpis"></div>
    <div class="grid">
      <div class="card sc"><h2>Detailed Calling Report <span class="mu" style="font-weight:600;font-size:13px">(Daily)</span></h2><div id="dayTable"></div></div>
      <div class="card"><h2>Calls Attempted by Report</h2><svg class="donut" id="dayDonut" viewBox="0 0 200 200"></svg><div id="dayLeg"></div></div>
    </div>
  </div>
  <div class="card sc" style="margin-bottom:14px"><h2>Daily Trend</h2><div id="trend"></div><div class="leg2"><span><span class="dot" style="background:var(--p)"></span>Attempted</span><span><span class="dot" style="background:var(--b);opacity:.55"></span>Connected</span></div></div>
  <div class="card sc"><h2>All Days</h2><div id="allDays"></div></div>
</section>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
/* ====== GOOGLE SHEET CSV LINK ====== */
const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQcWqQDMabT9PpSidVWSIPzNrCvibSV64bQVIexqSSAlUebvs4V7_fYhAQKUjs2Ee1REUIcA07bjviE/pub?gid=0&single=true&output=csv";
/* =================================== */

const CATS=[{k:'mm',n:'Madhyamaheshwar'},{k:'nmm',n:'Non Madhyamaheshwar'},{k:'upg',n:'Kalpeshwar Upgrade'},{k:'g26',n:'GOY 2026 Non MM'},{k:'g25',n:'GOY 2025 Non MM'},{k:'ash',n:'Ashram Program'}];
const GROUPS=[{n:'Abandoned Cart',c:'g',v:'var(--g)',rows:['mm','nmm'],sub:1},{n:'Upgrade',c:'b',v:'var(--b)',rows:['upg']},{n:'Invites',c:'r',v:'var(--r)',rows:['g26','g25']},{n:'Ashram Program',c:'p',v:'var(--p)',rows:['ash']}];
const LBL={ash:'–'};
const ICON={
 a:'<path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/>',
 c:'<path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/><path d="M15.05 5A5 5 0 0 1 19 8.95M15.05 1A9 9 0 0 1 23 8.94"/>',
 v:'<circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/>',
 r:'<path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>',
 t:'<path d="M18 20V10M12 20V4M6 20v-6"/>'};
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const num=x=>{const n=parseFloat(String(x).replace(/,/g,''));return Number.isFinite(n)?Math.max(0,Math.round(n)):0};
const blank=()=>{const o={};CATS.forEach(c=>o[c.k]={a:0,c:0,v:0});return o};
let base=blank(),days={},curDay='';

function parseCSV(t){const rows=[];let r=[],f='',q=false;
  for(let i=0;i<t.length;i++){const ch=t[i];
    if(q){if(ch==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=ch}
    else if(ch==='"')q=true;else if(ch===','){r.push(f);f=''}
    else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&t[i+1]==='\n')i++;r.push(f);rows.push(r);r=[];f=''}
    else f+=ch}
  if(f||r.length){r.push(f);rows.push(r)}return rows}
function isoDate(s){s=String(s).trim();let m;
  if(m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/))return m[1]+'-'+m[2].padStart(2,'0')+'-'+m[3].padStart(2,'0');
  if(m=s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})$/))return m[3]+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0');
  return null}
function load(rows){
  base=blank();days={};const map={};CATS.forEach(c=>map[c.n.toLowerCase()]=c.k);let bad=0;
  rows.slice(1).forEach(r=>{
    if(r.length<2||!String(r[0]).trim())return;
    const k=map[String(r[1]).trim().toLowerCase()];
    if(!k){if(String(r[1]).trim())bad++;return}
    const d=isoDate(r[0]);const t=d?(days[d]=days[d]||blank()):base;
    t[k].a+=num(r[2]);t[k].c+=num(r[3]);t[k].v+=num(r[4])});
  return bad}

const z=()=>({a:0,c:0,v:0});
function addRows(...l){const o=blank();l.forEach(r=>CATS.forEach(c=>{o[c.k].a+=r[c.k].a;o[c.k].c+=r[c.k].c;o[c.k].v+=r[c.k].v}));return o}
function tot(r,keys){const t=z();(keys||CATS.map(c=>c.k)).forEach(k=>{t.a+=r[k].a;t.c+=r[k].c;t.v+=r[k].v});return t}
const pct=(x,y)=>y?(100*x/y).toFixed(1)+'%':'–';
function fmtD(s,long){const d=new Date(s+'T00:00:00');return isNaN(d)?esc(s):d.toLocaleDateString('en-GB',long?{weekday:'long',day:'numeric',month:'long',year:'numeric'}:{day:'numeric',month:'short'})}
const sorted=()=>Object.keys(days).sort();

function kpis(r){const t=tot(r);
  const K=[['k-a','a','Calls Attempted',t.a],['k-c','c','Calls Connected',t.c],['k-v','v','Conversions',t.v],['k-r','r','Connection Rate',pct(t.c,t.a)],['k-t','t','Conversion Rate',pct(t.v,t.a)]];
  return K.map(k=>`<div class="card kpi ${k[0]}"><div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICON[k[1]]}</svg></div><div><div class="l">${k[2]}</div><div class="v">${k[3]}</div></div></div>`).join('')}

function table(r){
  const cell=(x,dash)=>dash?'<td class="mu">–</td>':`<td>${x}</td>`;
  let h='<table><tr><th>Calling Report</th><th>Category</th><th>Calls Attempted</th><th>Calls Connected</th><th>Conversions</th></tr>';
  GROUPS.forEach(g=>{
    g.rows.forEach((k,i)=>{const x=r[k],n=CATS.find(c=>c.k===k).n,e=!x.a&&!x.c&&!x.v;
      h+='<tr>'+(i===0?`<td class="grp ${g.c}" rowspan="${g.rows.length+(g.sub?1:0)}">${g.n}</td>`:'')+`<td>${LBL[k]||n}</td>${cell(x.a,e)}${cell(x.c,e)}${cell(x.v,e)}</tr>`});
    if(g.sub){const t=tot(r,g.rows);h+=`<tr class="st"><td>Total – ${g.n}</td><td>${t.a}</td><td>${t.c}</td><td>${t.v}</td></tr>`}});
  const t=tot(r);
  return h+`<tr class="tot"><td colspan="2">TOTAL</td><td>${t.a}</td><td>${t.c}</td><td>${t.v}</td></tr></table>`}

function donut(r,id,lid){
  const T=tot(r).a,C=2*Math.PI*70;let off=0,svg='',leg='',txt='';
  GROUPS.slice().sort((a,b)=>({'Abandoned Cart':0,'Ashram Program':1,'Upgrade':2,'Invites':3}[a.n]-({'Abandoned Cart':0,'Ashram Program':1,'Upgrade':2,'Invites':3}[b.n]))).forEach(g=>{
    const a=tot(r,g.rows).a,len=T?C*a/T:0;
    if(a){svg+=`<circle cx="100" cy="100" r="70" fill="none" stroke="${g.v}" stroke-width="34" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-off}" transform="rotate(-90 100 100)"/>`;
      if(a/T>=.06){const ang=(off+len/2)/C*2*Math.PI-Math.PI/2;txt+=`<text x="${100+70*Math.cos(ang)}" y="${100+70*Math.sin(ang)+4}" text-anchor="middle" font-size="11" font-weight="800" fill="#fff">${(100*a/T).toFixed(1)}%</text>`}}
    off+=len;leg+=`<div class="leg"><span><span class="dot" style="background:${g.v}"></span>${g.n}</span><b>${a} <span class="mu" style="font-weight:600">(${pct(a,T)})</span></b></div>`});
  if(!T)svg='<circle cx="100" cy="100" r="70" fill="none" stroke="var(--line)" stroke-width="34"/>';
  svg+=txt+`<text x="100" y="102" text-anchor="middle" font-size="32" font-weight="800" fill="currentColor">${T}</text><text x="100" y="121" text-anchor="middle" font-size="11" fill="currentColor" opacity=".65">Total Calls</text>`;
  $(id).innerHTML=svg;$(lid).innerHTML=leg}

function trend(){
  const ds=sorted().slice(-14);
  if(!ds.length){$('trend').innerHTML='<div class="empty">No daily rows yet. Add them in the Google Sheet.</div>';return}
  const v=ds.map(d=>tot(days[d])),mx=Math.max(1,...v.map(x=>x.a)),bw=44,W=ds.length*bw+20,H=150;
  let s=`<svg viewBox="0 0 ${W} ${H+30}" style="min-width:${Math.min(W,600)}px;width:100%;max-height:230px"><defs><linearGradient id="gp" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6a6ae0"/><stop offset="1" stop-color="#4a4aa8"/></linearGradient></defs>`;
  ds.forEach((d,i)=>{const x=10+i*bw,ha=H*v[i].a/mx,hc=H*v[i].c/mx;
    s+=`<rect x="${x+4}" y="${H-ha}" width="15" height="${ha}" rx="4" fill="url(#gp)"/><rect x="${x+22}" y="${H-hc}" width="15" height="${hc}" rx="4" fill="var(--b)" opacity=".55"/><text x="${x+21}" y="${H-ha-5}" font-size="10" font-weight="700" text-anchor="middle" fill="currentColor">${v[i].a}</text><text x="${x+21}" y="${H+16}" font-size="10" text-anchor="middle" fill="currentColor" opacity=".7">${fmtD(d)}</text>`});
  $('trend').innerHTML=s+'</svg>'}

function render(){
  const ds=sorted(),all=addRows(base,...ds.map(d=>days[d]));
  $('range').textContent='Weeks 1–4 + daily entries'+(ds.length?' · latest: '+fmtD(ds[ds.length-1]):'')+' · updated '+new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
  $('cumKpis').innerHTML=kpis(all);$('cumTable').innerHTML=table(all);donut(all,'cumDonut','cumLeg');
  if(!ds.includes(curDay))curDay=ds[ds.length-1]||'';
  $('chips').innerHTML=ds.slice().reverse().map(d=>`<button class="chip${d===curDay?' on':''}" data-d="${esc(d)}">${fmtD(d)}</button>`).join('');
  document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{curDay=b.dataset.d;render()});
  if(curDay){const r=days[curDay];
    $('dayBody').classList.remove('hide');$('dayLbl').textContent='Daily Report';$('daySub').textContent=fmtD(curDay,true);
    $('dayKpis').innerHTML=kpis(r);$('dayTable').innerHTML=table(r);donut(r,'dayDonut','dayLeg')}
  else{$('dayBody').classList.add('hide')}
  trend();
  const bt=tot(base);let a='<table style="min-width:420px"><tr><th>Date</th><th>Connection</th><th>Attempted</th><th>Connected</th><th>Conv.</th></tr>';
  ds.slice().reverse().forEach(d=>{const x=tot(days[d]);a+=`<tr><td style="text-align:left;font-weight:700">${fmtD(d)}</td><td>${pct(x.c,x.a)}</td><td>${x.a}</td><td>${x.c}</td><td>${x.v}</td></tr>`});
  a+=`<tr class="tot"><td style="text-align:left">Weeks 1–4</td><td>${pct(bt.c,bt.a)}</td><td>${bt.a}</td><td>${bt.c}</td><td>${bt.v}</td></tr></table>`;
  $('allDays').innerHTML=a}

function say(t){const m=$('msg');m.textContent=t;m.classList.toggle('hide',!t)}
async function refresh(){
  if(!SHEET_CSV_URL){say('Setup needed: add your Google Sheet CSV link in index.html.');return}
  const root=SHEET_CSV_URL.split('?')[0];
  const tries=[SHEET_CSV_URL,root+'?output=csv',root+'?gid=0&output=csv',root.replace(/\/pub$/,'/pub')+'?single=true&output=csv'];
  const errs=[];
  for(const u of tries){
    try{
      const res=await fetch(u+(u.includes('?')?'&':'?')+'t='+Date.now(),{cache:'no-store'});
      if(!res.ok)throw new Error('HTTP '+res.status);
      const txt=await res.text();
      if(!/^\s*"?Date"?\s*,/i.test(txt))throw new Error('not CSV (sheet may be published as a web page)');
      const bad=load(parseCSV(txt));
      try{localStorage.setItem('cd_csv',txt)}catch(e){}
      say(bad?bad+' row(s) ignored: category name not recognised. Check spelling in column B.':'');render();return
    }catch(e){errs.push(e.message)}}
  let cached=null;try{cached=localStorage.getItem('cd_csv')}catch(e){}
  if(cached){load(parseCSV(cached));render()}
  const why=location.protocol==='file:'?' You opened the downloaded file. Open your github.io link instead.':'';
  say((cached?'Showing last saved data. ':'')+'Could not load the sheet ('+errs[0]+').'+why+' In Google Sheets use File → Share → Publish to web, pick Sheet1 and Comma-separated values (.csv).')}

document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b));
  ['cum','day'].forEach(s=>$(s).classList.toggle('hide',s!==b.dataset.t))});

$('shot').onclick=async()=>{
  if(!window.html2canvas){say('Screenshot tool did not load. Check your internet connection.');return}
  try{
    const bg=getComputedStyle(document.body).color.match(/\d+/g).map(Number);const dark=(bg[0]+bg[1]+bg[2])>380;
    const cv=await html2canvas($('cap'),{backgroundColor:dark?'#0e1428':'#eef3ff',scale:2,ignoreElements:e=>!!(e.dataset&&e.dataset.noshot)});
    const blob=await new Promise(r=>cv.toBlob(r,'image/png'));
    const name='calling-dashboard-'+new Date().toISOString().slice(0,10)+'.png',file=new File([blob],name,{type:'image/png'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title:'Calling dashboard'});return}catch(e){if(e.name==='AbortError')return}}
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove()
  }catch(e){say('Could not create screenshot: '+e.message)}};

refresh();setInterval(refresh,120000);
</script></body></html>
